name = "mapi"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

[observability]
enabled = true

[assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

[[d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "dbd92070-15d9-4442-9b10-fe0eb03b47df"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-kv-id"

[vars]
JWT_SECRET = "placeholder-jwt-secret-replace-in-production"
ENVIRONMENT = "dev"
CONSUMER_BASE_URL = "http://localhost:5175"
LLM_API_KEY = ""
LLM_API_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemma-4-31b-it"

[env.production]
name = "mapi"

[env.production.vars]
JWT_SECRET = ""
ENVIRONMENT = "production"
SQUARE_ACCESS_TOKEN = ""
SQUARE_APP_ID = ""
SQUARE_LOCATION_ID = ""
BREVO_API_KEY = ""
SENDER_EMAIL = "automated@masjidsuffah.com"
SENDER_NAME = "Masjid Suffah"
FORWARD_TO_EMAIL = "suffahmasjid@gmail.com"
LOGGING_EMAIL = "masjidsuffahlogging@gmail.com"
BOT_NAME = "masjid-api/1.0"
CONSUMER_BASE_URL = "https://masjid-live.pages.dev"
LLM_API_KEY = ""
LLM_API_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemma-4-31b-it"

[[env.production.d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "dbd92070-15d9-4442-9b10-fe0eb03b47df"

[env.production.assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"

# Staging mirror (docs/integration-testing.md §2.1) — full API + its OWN D1.
# Deployed by .github/workflows/deploy-staging.yml on pushes to `staging`.
# CI injects the real database id over placeholder-staging-db-id.
[env.staging]
name = "mapi-staging"

[env.staging.vars]
JWT_SECRET = ""
ENVIRONMENT = "staging"
SQUARE_ACCESS_TOKEN = ""
SQUARE_APP_ID = ""
SQUARE_LOCATION_ID = ""
BREVO_API_KEY = ""
SENDER_EMAIL = "automated@masjidsuffah.com"
SENDER_NAME = "Masjid Suffah (Staging)"
FORWARD_TO_EMAIL = "suffahmasjid@gmail.com"
LOGGING_EMAIL = "masjidsuffahlogging@gmail.com"
BOT_NAME = "masjid-api-staging/1.0"
CONSUMER_BASE_URL = "https://masjid-staging.pages.dev"
LLM_API_KEY = ""
LLM_API_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemma-4-31b-it"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "masjid-db-staging"
database_id = "placeholder-staging-db-id"

[env.staging.assets]
binding = "ASSETS"
directory = ".svelte-kit/cloudflare"