name = "mapi"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
main = ".svelte-kit/cloudflare/_worker.js"

[[d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "placeholder-db-id"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-kv-id"

[vars]
JWT_SECRET = "placeholder-jwt-secret-replace-in-production"
ENVIRONMENT = "dev"

[env.production]
name = "mapi"

[env.production.vars]
JWT_SECRET = ""
ENVIRONMENT = "production"
SQUARE_ACCESS_TOKEN = ""
SQUARE_APP_ID = ""
SQUARE_LOCATION_ID = ""
BREVO_API_KEY = ""
SENDER_EMAIL = "automated@masjidsuffah.com"
SENDER_NAME = "Masjid Suffah"
FORWARD_TO_EMAIL = "suffahmasjid@gmail.com"
LOGGING_EMAIL = "masjidsuffahlogging@gmail.com"
BOT_NAME = "masjid-api/1.0"

[[env.production.d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "placeholder-db-id"