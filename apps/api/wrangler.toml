name = "masjid-api"
compatibility_date = "2024-12-01"
main = ".svelte-kit/cloudflare/_worker.js"

[[d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "placeholder-db-id"

[[kv_namespaces]]
binding = "CACHE"
id = "placeholder-kv-id"

[vars]
JWT_SECRET = "placeholder-jwt-secret-replace-in-production"
ENVIRONMENT = "dev"