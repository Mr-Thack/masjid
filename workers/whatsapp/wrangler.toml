name = "mwa"
compatibility_date = "2024-12-01"
# global_fetch_strictly_public: this worker calls the mapi worker via its public
# URL (API_URL). Without the flag, Cloudflare blocks same-zone Worker→Worker
# subrequests with error 1042. (Named environments inherit compatibility flags.)
compatibility_flags = ["global_fetch_strictly_public"]
main = "src/index.ts"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "placeholder-db-id"

[[r2_buckets]]
binding = "ASSETS"
bucket_name = "masjid-assets"

[vars]
API_URL = "https://api.example.com"
JWT_SECRET = "placeholder-jwt-secret"
WHATSAPP_TOKEN = "placeholder-whatsapp-token"
WHATSAPP_PHONE_ID = "placeholder-phone-id"
WHATSAPP_VERIFY_TOKEN = "placeholder-verify-token"
LLM_API_URL = "https://openrouter.ai/api/v1"
LLM_API_KEY = "placeholder-openrouter-key"
LLM_MODEL = "google/gemma-4-31b-it"

[env.production]
name = "mwa"

[env.production.vars]
API_URL = ""
JWT_SECRET = ""
LLM_API_URL = "https://openrouter.ai/api/v1"
LLM_MODEL = "google/gemma-4-31b-it"

[[env.production.d1_databases]]
binding = "DB"
database_name = "masjid-db"
database_id = "placeholder-db-id"

[[env.production.r2_buckets]]
binding = "ASSETS"
bucket_name = "masjid-assets"