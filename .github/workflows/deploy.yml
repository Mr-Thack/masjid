name: Deploy to Cloudflare

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      workers_json: ${{ steps.changes.outputs.workers_json }}
      pages_json: ${{ steps.changes.outputs.pages_json }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Detect changed packages
        id: changes
        run: |
          set -e
          node tooling/changed-packages.js | tee /tmp/changes_raw.txt
          tail -1 /tmp/changes_raw.txt > /tmp/changes.json

          if ! jq -e . /tmp/changes.json > /dev/null 2>&1; then
            echo "::error::Failed to parse changes JSON — deploying nothing"
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "workers_json=[]" >> $GITHUB_OUTPUT
            echo "pages_json=[]" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(jq -r '.changed' /tmp/changes.json)
          WORKERS=$(jq -c '.workers' /tmp/changes.json)
          PAGES=$(jq -c '.pages' /tmp/changes.json)

          echo "changed=${CHANGED}" >> $GITHUB_OUTPUT
          echo "workers_json=${WORKERS}" >> $GITHUB_OUTPUT
          echo "pages_json=${PAGES}" >> $GITHUB_OUTPUT

          echo "::notice::changed=${CHANGED} workers=$(jq -r '[.workers[].name] | join(",")' /tmp/changes.json) pages=$(jq -r '[.pages[].name] | join(",")' /tmp/changes.json)"

  deploy-workers:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true' && needs.detect-changes.outputs.workers_json != '[]'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID || secrets.CLOUDFLARE_D1_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.workers_json) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build worker
        run: npm run build --workspace=${{ matrix.workspace }}

      - name: Inject D1 database ID
        run: |
          sed -i "s/placeholder-db-id/$CLOUDFLARE_D1_ID/g" apps/api/wrangler.toml workers/whatsapp/wrangler.toml workers/push/wrangler.toml

      - name: Deploy worker
        run: |
          VAR_ARGS=()
          [ -n "$JWT_SECRET" ] && VAR_ARGS+=(--var "JWT_SECRET:$JWT_SECRET")
          [ -n "$SQUARE_ACCESS_TOKEN" ] && VAR_ARGS+=(--var "SQUARE_ACCESS_TOKEN:$SQUARE_ACCESS_TOKEN")
          [ -n "$SQUARE_APP_ID" ] && VAR_ARGS+=(--var "SQUARE_APP_ID:$SQUARE_APP_ID")
          [ -n "$SQUARE_LOCATION_ID" ] && VAR_ARGS+=(--var "SQUARE_LOCATION_ID:$SQUARE_LOCATION_ID")
          [ -n "$BREVO_API_KEY" ] && VAR_ARGS+=(--var "BREVO_API_KEY:$BREVO_API_KEY")
          [ -n "$SENDER_EMAIL" ] && VAR_ARGS+=(--var "SENDER_EMAIL:$SENDER_EMAIL")
          [ -n "$SENDER_NAME" ] && VAR_ARGS+=(--var "SENDER_NAME:$SENDER_NAME")
          [ -n "$FORWARD_TO_EMAIL" ] && VAR_ARGS+=(--var "FORWARD_TO_EMAIL:$FORWARD_TO_EMAIL")
          [ -n "$LOGGING_EMAIL" ] && VAR_ARGS+=(--var "LOGGING_EMAIL:$LOGGING_EMAIL")
          [ -n "$WHATSAPP_TOKEN" ] && VAR_ARGS+=(--var "WHATSAPP_TOKEN:$WHATSAPP_TOKEN")
          [ -n "$WHATSAPP_PHONE_ID" ] && VAR_ARGS+=(--var "WHATSAPP_PHONE_ID:$WHATSAPP_PHONE_ID")
          [ -n "$WHATSAPP_VERIFY_TOKEN" ] && VAR_ARGS+=(--var "WHATSAPP_VERIFY_TOKEN:$WHATSAPP_VERIFY_TOKEN")
          [ -n "$LLM_API_KEY" ] && VAR_ARGS+=(--var "LLM_API_KEY:$LLM_API_KEY")
          [ -n "$API_URL" ] && VAR_ARGS+=(--var "API_URL:$API_URL")
          [ -n "$VAPID_PUBLIC_KEY" ] && VAR_ARGS+=(--var "VAPID_PUBLIC_KEY:$VAPID_PUBLIC_KEY")
          [ -n "$VAPID_PRIVATE_KEY" ] && VAR_ARGS+=(--var "VAPID_PRIVATE_KEY:$VAPID_PRIVATE_KEY")
          npx wrangler@latest deploy --env production --var ENVIRONMENT:production "${VAR_ARGS[@]}"
        working-directory: ${{ matrix.dir }}

  deploy-pages:
    needs: detect-changes
    if: needs.detect-changes.outputs.changed == 'true' && needs.detect-changes.outputs.pages_json != '[]'
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.pages_json) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build page
        run: npm run build --workspace=${{ matrix.workspace }}
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}

      - name: Debug auth
        run: |
          echo "::notice::Total env vars: $(env | wc -l)"
          echo "::notice::Matching CLOUDFLARE vars:"
          env | grep -i cloudflare || echo "(none)"
          echo "::notice::All CF/CLOUDFLARE related:"
          env | grep -iE '^(CF_|CLOUDFLARE)' || echo "(none)"
          if [ -n "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          else
            echo "::error::CLOUDFLARE_API_TOKEN is EMPTY"
          fi

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@latest pages deploy build --project-name=${{ matrix.name == 'consumer' && 'masjid' || matrix.name == 'tv' && 'tv' || 'madmin' }} --branch=master
        working-directory: ${{ matrix.dir }}

  summary:
    needs: [detect-changes, deploy-workers, deploy-pages]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          if [ "${{ needs.detect-changes.outputs.changed }}" != "true" ]; then
            echo "## No deployable changes — skipped." >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Workers: ${{ needs.deploy-workers.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Pages: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
