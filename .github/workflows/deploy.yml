name: Deploy to Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-workers:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID || secrets.CLOUDFLARE_D1_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            workspace: '@masjid/api'
            dir: apps/api
          - name: whatsapp
            workspace: '@masjid/worker-whatsapp'
            dir: workers/whatsapp
          - name: push
            workspace: '@masjid/worker-push'
            dir: workers/push
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lesson-18 guard: fail BEFORE shipping if schema.sql and the Drizzle
      # schema have drifted (runs for every worker; cheap static check).
      - name: Schema drift check
        run: npm run check-schema

      - name: Build worker
        run: npm run build --workspace=${{ matrix.workspace }}

      - name: Inject D1 database ID
        run: |
          sed -i "s/placeholder-db-id/$CLOUDFLARE_D1_ID/g" apps/api/wrangler.toml workers/whatsapp/wrangler.toml workers/push/wrangler.toml

      - name: Deploy worker
        run: |
          VAR_ARGS=()
          [ -n "$JWT_SECRET" ] && VAR_ARGS+=(--var "JWT_SECRET:$JWT_SECRET")
          [ -n "$SQUARE_ACCESS_TOKEN" ] && VAR_ARGS+=(--var "SQUARE_ACCESS_TOKEN:$SQUARE_ACCESS_TOKEN")
          [ -n "$SQUARE_APP_ID" ] && VAR_ARGS+=(--var "SQUARE_APP_ID:$SQUARE_APP_ID")
          [ -n "$SQUARE_LOCATION_ID" ] && VAR_ARGS+=(--var "SQUARE_LOCATION_ID:$SQUARE_LOCATION_ID")
          [ -n "$BREVO_API_KEY" ] && VAR_ARGS+=(--var "BREVO_API_KEY:$BREVO_API_KEY")
          [ -n "$SENDER_EMAIL" ] && VAR_ARGS+=(--var "SENDER_EMAIL:$SENDER_EMAIL")
          [ -n "$SENDER_NAME" ] && VAR_ARGS+=(--var "SENDER_NAME:$SENDER_NAME")
          [ -n "$FORWARD_TO_EMAIL" ] && VAR_ARGS+=(--var "FORWARD_TO_EMAIL:$FORWARD_TO_EMAIL")
          [ -n "$LOGGING_EMAIL" ] && VAR_ARGS+=(--var "LOGGING_EMAIL:$LOGGING_EMAIL")
          [ -n "$WHATSAPP_TOKEN" ] && VAR_ARGS+=(--var "WHATSAPP_TOKEN:$WHATSAPP_TOKEN")
          [ -n "$WHATSAPP_PHONE_ID" ] && VAR_ARGS+=(--var "WHATSAPP_PHONE_ID:$WHATSAPP_PHONE_ID")
          [ -n "$WHATSAPP_VERIFY_TOKEN" ] && VAR_ARGS+=(--var "WHATSAPP_VERIFY_TOKEN:$WHATSAPP_VERIFY_TOKEN")
          [ -n "$LLM_API_KEY" ] && VAR_ARGS+=(--var "LLM_API_KEY:$LLM_API_KEY")
          [ -n "$API_URL" ] && VAR_ARGS+=(--var "API_URL:$API_URL")
          [ -n "$VAPID_PUBLIC_KEY" ] && VAR_ARGS+=(--var "VAPID_PUBLIC_KEY:$VAPID_PUBLIC_KEY")
          [ -n "$VAPID_PRIVATE_KEY" ] && VAR_ARGS+=(--var "VAPID_PRIVATE_KEY:$VAPID_PRIVATE_KEY")
          npx wrangler@latest deploy --env production --keep-vars --var ENVIRONMENT:production "${VAR_ARGS[@]}"
        working-directory: ${{ matrix.dir }}

  deploy-pages:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      VITE_API_URL: ${{ secrets.VITE_API_URL || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & merge all page apps
        run: node tooling/merge-pages.js

      - name: Deploy unified Pages project (advanced-mode _worker.js router)
        run: npx wrangler@latest pages deploy .merged --project-name=masjid-live --branch=master

  e2e-prod:
    needs: [deploy-workers, deploy-pages]
    if: always() && needs.deploy-workers.result == 'success' && needs.deploy-pages.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      # Read-only smoke vs production. The deploy is already live at this
      # point — a red result pages a human; it does not roll back.
      # (whatsapp/agent vitest suites intentionally not run — currently red.)
      - name: Browser E2E smoke vs prod (read-only)
        run: sleep 30 && npm run test:e2e:prod

  summary:
    needs: [deploy-workers, deploy-pages, e2e-prod]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "Workers: ${{ needs.deploy-workers.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Pages: ${{ needs.deploy-pages.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E (prod, read-only): ${{ needs.e2e-prod.result }}" >> $GITHUB_STEP_SUMMARY