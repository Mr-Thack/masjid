name: Deploy Staging

# Staging = FULL mirror of production (docs/integration-testing.md §2.1):
#   API worker  mapi-staging → mapi-staging.mr-thack.workers.dev
#   D1          masjid-db-staging (separate, disposable — seeded per checklist)
#   Pages       masjid-staging → masjid-staging.pages.dev (VITE_API_URL=mapi-staging)
# The e2e-staging job gates promotion: merge staging → master only when green.

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  deploy-worker-staging:
    runs-on: ubuntu-latest
    environment: Staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_STAGING_ID: ${{ vars.CLOUDFLARE_D1_STAGING_ID || secrets.CLOUDFLARE_D1_STAGING_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lesson-18 guard: fail the deploy BEFORE anything ships if
      # schema.sql and the Drizzle schema have drifted.
      - name: Schema drift check
        run: npm run check-schema

      # Live-D1 guard: the file check above only proves schema.sql and
      # schema.ts agree — it can't see the real database (the staging DB was
      # missing the posts table on 2026-08-06 and every masjid endpoint 500'd
      # post-deploy). Fail BEFORE the worker ships if the target database is
      # missing tables/columns the code needs. Resolved by name so a recreated
      # database (new UUID) never goes stale.
      - name: Live D1 drift check
        run: npx tsx tooling/check-d1-drift.ts masjid-db-staging

      - name: Build API worker
        run: npm run build --workspace=@masjid/api

      # Only the staging placeholder — never touch the prod database_id.
      - name: Inject staging D1 database ID
        run: sed -i "s/placeholder-staging-db-id/$CLOUDFLARE_D1_STAGING_ID/g" apps/api/wrangler.toml

      # Loop-built --var args (lessons 4/27: && chains abort silently).
      # --keep-vars preserves any dashboard-set vars.
      - name: Deploy API worker (staging)
        run: |
          VAR_ARGS=()
          for v in JWT_SECRET SQUARE_ACCESS_TOKEN SQUARE_APP_ID SQUARE_LOCATION_ID BREVO_API_KEY LLM_API_KEY; do
            val="${!v}"; [ -n "$val" ] && VAR_ARGS+=(--var "$v:$val")
          done
          npx wrangler@latest deploy --env staging --keep-vars --var ENVIRONMENT:staging "${VAR_ARGS[@]}"
        working-directory: apps/api

      # Hermetic E2E state: wipe + reseed the disposable staging DB on every
      # deploy (docs/e2e-determinism.md §P5). Resets enrollment_open, clears
      # e2e-smoke-* masjids and any mutation-test residue, so no run can
      # inherit drift from a previous one.
      - name: Reseed staging D1
        run: |
          npx tsx tooling/dump-seed-sql.ts /tmp/staging-seed.sql
          npx wrangler@latest d1 execute masjid-db-staging --remote --file=/tmp/staging-seed.sql

  deploy-pages-staging:
    runs-on: ubuntu-latest
    environment: Staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Build-time API URL — staging pages call the STAGING API:
      VITE_API_URL: https://mapi-staging.mr-thack.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build & merge all page apps
        run: node tooling/merge-pages.js

      - name: Deploy staging Pages project (advanced-mode _worker.js router)
        # --branch=master = the project's production branch, so the stable
        # masjid-staging.pages.dev hostname (not a preview URL) is updated.
        run: npx wrangler@latest pages deploy .merged --project-name=masjid-staging --branch=master

  e2e-api:
    needs: [deploy-worker-staging, deploy-pages-staging]
    runs-on: ubuntu-latest
    env: { E2E_ENV: 'staging' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: API + worker smoke (no browser)
        # Probe first: waits out the post-deploy 503 window AND verifies the
        # worker serves THIS commit (build_id == GITHUB_SHA). This job
        # historically ran ungated inside the propagation window.
        run: |
          E2E_ENV=staging node tests/e2e/wait-for-deploy.js api
          E2E_ENV=staging node tests/e2e/run.js --suite=api --suite=worker

  e2e-deploy:
    needs: [deploy-worker-staging, deploy-pages-staging, e2e-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Deploy integrity (no browser)
        run: |
          E2E_ENV=staging node tests/e2e/wait-for-deploy.js consumer
          E2E_ENV=staging node tests/e2e/run.js --suite=deploy

  e2e-consumer:
    needs: [deploy-worker-staging, deploy-pages-staging, e2e-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Consumer browser E2E
        # Probe replaces blind sleep: waits until the runner's edge serves the
        # fresh deploy (build-id match + chunks real) and warms it (2026-08-06).
        # 5-min warmup lets CDN edges fully propagate and API/D1 wake up.
        run: |
          E2E_ENV=staging node tests/e2e/wait-for-deploy.js consumer
          E2E_ENV=staging E2E_WARMUP_SECONDS=30 E2E_SUITE_WATCHDOG_MS=480000 node tests/e2e/run.js --suite=consumer
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || '' }}

  e2e-tv:
    needs: [deploy-worker-staging, deploy-pages-staging, e2e-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: TV browser E2E
        run: |
          E2E_ENV=staging node tests/e2e/wait-for-deploy.js tv
          E2E_ENV=staging E2E_WARMUP_SECONDS=30 node tests/e2e/run.js --suite=tv

  e2e-admin:
    needs: [deploy-worker-staging, deploy-pages-staging, e2e-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium --with-deps
      - name: Admin browser E2E
        run: |
          E2E_ENV=staging node tests/e2e/wait-for-deploy.js admin
          E2E_ENV=staging E2E_WARMUP_SECONDS=30 node tests/e2e/run.js --suite=admin
        env:
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || '' }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || '' }}

  summary:
    needs: [deploy-worker-staging, deploy-pages-staging, e2e-api, e2e-deploy, e2e-consumer, e2e-tv, e2e-admin]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## Staging Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "API worker: ${{ needs.deploy-worker-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Pages: ${{ needs.deploy-pages-staging.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E api: ${{ needs.e2e-api.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E deploy: ${{ needs.e2e-deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E consumer: ${{ needs.e2e-consumer.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E tv: ${{ needs.e2e-tv.result }}" >> $GITHUB_STEP_SUMMARY
          echo "E2E admin: ${{ needs.e2e-admin.result }}" >> $GITHUB_STEP_SUMMARY
