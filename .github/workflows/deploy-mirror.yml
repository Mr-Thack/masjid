name: Deploy Mirror (Advanced Code + Prod D1)

# Mirror = NEW code running against the SAME production D1 (masjid-db).
# Unlike staging (own D1, disposable, reseeded), the mirror reads/writes
# live production data — useful for verifying fixes (e.g. Square) against
# real config without touching the mapi worker.
#
#   API worker  mapi-mirror → mapi-mirror.mr-thack.workers.dev
#   D1          masjid-db (SAME as production — shared, NOT disposable)
#   Pages       masjid-mirror → masjid-mirror.pages.dev (VITE_API_URL=mapi-mirror)
#
# NO reseed step — never wipes the production DB. NO E2E — the mirror
# shares live data, so mutation suites must not run against it.

on:
  workflow_dispatch:

concurrency:
  group: deploy-mirror
  cancel-in-progress: false

jobs:
  d1-drift-check:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The mirror shares the prod D1 — gate on the SAME live database the
      # worker will read. Fails BEFORE shipping if the code needs tables or
      # columns the prod DB doesn't have.
      - name: Live D1 drift check (prod DB)
        run: npx tsx tooling/check-d1-drift.ts masjid-db

  deploy-worker-mirror:
    needs: [d1-drift-check]
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_ID: ${{ vars.CLOUDFLARE_D1_ID || secrets.CLOUDFLARE_D1_ID }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
      SQUARE_APP_ID: ${{ secrets.SQUARE_APP_ID }}
      SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lesson-18 guard: fail the deploy BEFORE anything ships if
      # schema.sql and the Drizzle schema have drifted.
      - name: Schema drift check
        run: npm run check-schema

      - name: Build API worker
        run: npm run build --workspace=@masjid/api

      # Same prod D1 database id, injected over the mirror placeholder.
      - name: Inject prod D1 database ID
        run: sed -i "s/placeholder-mirror-db-id/$CLOUDFLARE_D1_ID/g" apps/api/wrangler.toml

      # Loop-built --var args (lessons 4/27: && chains abort silently).
      # ENVIRONMENT=production keeps the Square base URL on connect.squareup.com.
      # --keep-vars preserves any dashboard-set vars.
      - name: Deploy API worker (mirror)
        run: |
          VAR_ARGS=()
          for v in JWT_SECRET SQUARE_ACCESS_TOKEN SQUARE_APP_ID SQUARE_LOCATION_ID BREVO_API_KEY LLM_API_KEY VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY; do
            val="${!v}"; [ -n "$val" ] && VAR_ARGS+=(--var "$v:$val")
          done
          npx wrangler@latest deploy --env mirror --keep-vars --var ENVIRONMENT:production "${VAR_ARGS[@]}"
        working-directory: apps/api

  deploy-pages-mirror:
    runs-on: ubuntu-latest
    environment: Prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Build-time API URL — mirror pages call the MIRROR API:
      VITE_API_URL: https://mapi-mirror.mr-thack.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Create mirror Pages project (idempotent)
        run: npx wrangler@latest pages project create masjid-mirror --production-branch=master || true

      - name: Build & merge all page apps
        run: node tooling/merge-pages.js

      - name: Deploy mirror Pages project (advanced-mode _worker.js router)
        run: npx wrangler@latest pages deploy .merged --project-name=masjid-mirror --branch=master

  summary:
    needs: [d1-drift-check, deploy-worker-mirror, deploy-pages-mirror]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo "## Mirror Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "D1 drift gate (prod DB): ${{ needs.d1-drift-check.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Worker (mapi-mirror): ${{ needs.deploy-worker-mirror.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Pages (masjid-mirror): ${{ needs.deploy-pages-mirror.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Mirror API: https://mapi-mirror.mr-thack.workers.dev" >> $GITHUB_STEP_SUMMARY
          echo "Mirror frontend: https://masjid-mirror.pages.dev" >> $GITHUB_STEP_SUMMARY
